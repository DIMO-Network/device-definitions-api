syntax = "proto3";

import "google/protobuf/empty.proto";

option go_package = "github.com/DIMO-Network/device-definitions-api/pkg/grpc";

package grpc;

message DecodeVinRequest {
  string vin = 1;
  string country = 2;
  string known_model = 3;
  int32 known_year = 4;
}

message DecodeVinResponse {
  string device_make_id = 1 [deprecated=true];
  string device_style_id = 3;
  int32 year = 4;
  string source = 5;
  string powertrain = 6;
  string new_trx_hash = 8;
  // new human readable tableland id
  string definition_id = 9;
  string model = 10;
  string manufacturer = 11;
  // Trim the VIN narrowed to. Empty when match_quality is not "exact".
  string trim = 12;
  // Version of the template this answer came from, so a caller can pin,
  // cache and reproduce a decode.
  int32 template_version = 13;
  // "exact", "ambiguous", or "model-only" when the trim matcher ran.
  // Empty means it did not run at all: there is no template for this
  // definition yet, or the template could not be read. That is deliberately
  // distinct from "model-only", which asserts that a real template was read
  // and no trim in it matched.
  string match_quality = 14;
  // Trim names still in contention when match_quality is "ambiguous".
  repeated string match_candidates = 15;
  // Which selectors fired: any of "manufacturerCode", "styleName",
  // "vinPattern". Empty unless match_quality is "exact".
  repeated string match_by = 16;
  // Effective hardware template: the matched trim's override if it has one,
  // otherwise the template's. Resolved here so callers never reimplement the
  // fallback. On an ambiguous or model-only match no trim was chosen, so this
  // is the template's value.
  string hardware_template_id = 17;
}

message UpsertDecodingRequest {
  string vin = 1;
  string target_definition_id = 2;
}

service VinDecoderService {
  rpc DecodeVin(DecodeVinRequest) returns (DecodeVinResponse);
  // used to change what a vin points to or insert a new vin to definition id mapping
  rpc UpsertDecoding(UpsertDecodingRequest) returns (google.protobuf.Empty);
}
